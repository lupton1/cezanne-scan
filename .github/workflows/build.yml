name: build

# Tests run on every push to main (Linux only, cheap).
# Installers for Windows, macOS and Linux are built when:
#   * a tag starting with v is pushed (also publishes a GitHub release with the installers), or
#   * the workflow is started by hand (Actions tab, Run workflow), or
#   * a commit message on main contains [package].
# Private repositories pay for Actions minutes (macOS minutes count ten times),
# which is why installers are not built on every push.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  PACKAGER_VERSION: 0.11.8

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries for the GUI
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: Simulated scan through the CLI
        run: cargo run --release -p cezanne-cli -- scan --sim --dpi 300 --film color-negative --auto -o sim.tif

  package:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[package]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: nsis
          - os: macos-14
            # one universal app for Intel and Apple Silicon Macs, see the macOS steps below
            target: universal-apple-darwin
            formats: app
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libwayland-dev libfuse2 file
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cargo-packager
        shell: bash
        run: cargo install cargo-packager --locked --version "$PACKAGER_VERSION"
      - name: Build
        if: runner.os != 'macOS'
        run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Build universal macOS binaries (Intel and Apple Silicon)
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        run: |
          cargo build --release --workspace --target aarch64-apple-darwin
          cargo build --release --workspace --target x86_64-apple-darwin
          U=target/universal-apple-darwin/release
          mkdir -p "$U"
          for b in cezanne-scan cezanne-cli cezanne-bridge; do
            lipo -create -output "$U/$b" "target/aarch64-apple-darwin/release/$b" "target/x86_64-apple-darwin/release/$b"
            lipo -info "$U/$b"
          done
      - name: Package macOS app, ad hoc signature and dmg
        if: runner.os == 'macOS'
        shell: bash
        run: |
          OUT="target/universal-apple-darwin/release"
          cargo packager -c Packager.toml --release --target universal-apple-darwin --formats app --out-dir "$OUT"
          APP="$OUT/Cezanne Scan.app"
          # no Apple Developer ID: sign ad hoc so Apple Silicon Macs accept the binaries
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Packager.toml | head -1)
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p out
          hdiutil create -volname "Cezanne Scan" -srcfolder "$STAGE" -ov -format UDZO "out/Cezanne Scan_${VERSION}_universal.dmg"
          ls -la out
      - name: Package
        if: runner.os != 'macOS'
        shell: bash
        run: |
          OUT="target/${{ matrix.target }}/release"
          cargo packager -c Packager.toml --release --target ${{ matrix.target }} --formats ${{ matrix.formats }} --out-dir "$OUT"
          mkdir -p out
          find "$OUT" -maxdepth 1 -type f \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: cezanne-scan-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from the changelog
        shell: bash
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## "v" " {p=1; next} /^## / && p {exit} p' CHANGELOG.md > release-notes.md
          {
            echo
            echo "## Downloads"
            echo
            echo "* Windows 10 and 11: the setup.exe"
            echo "* macOS 10.15 or later, Intel or Apple Silicon: the universal .dmg. The app is not signed with a Developer ID: on macOS 15 open it once, then use System Settings, Privacy and Security, Open Anyway (on older macOS right click the app and choose Open)"
            echo "* Linux: the .deb or the .AppImage"
          } >> release-notes.md
          cat release-notes.md
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          name: Cezanne Scan ${{ github.ref_name }}
          body_path: release-notes.md
          files: artifacts/*
