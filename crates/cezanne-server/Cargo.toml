[package]
name = "cezanne-server"
description = "Runs next to the scanner and serves the Cezanne Scan interface as a web page on the local network"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "cezanne-server"
path = "src/main.rs"

[dependencies]
cezanne-core.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
