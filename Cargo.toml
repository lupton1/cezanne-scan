[workspace]
resolver = "2"
members = [
    "crates/cezanne-core",
    "crates/cezanne-cli",
    "crates/cezanne-bridge",
    "crates/cezanne-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/lupton1/cezanne-scan"
authors = ["lupton1"]

[workspace.dependencies]
cezanne-core = { path = "crates/cezanne-core" }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive", "env"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2
